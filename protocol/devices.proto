syntax = "proto3";

package dronegroundcontrol;


message Client{
    uint32 id = 1;
    string name = 2;
}

message Device{
    uint32 id = 1;
    string name = 2;
    string type = 3;
    Client client_id = 4;
}

message Devices{
    uint32 start = 1;
    uint32 range = 2;
    repeated Device devicelist = 3;
}
