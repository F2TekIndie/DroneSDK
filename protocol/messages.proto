syntax = "proto3";

package dronegroundcontrol;

import "devices.proto";
import "attributes.proto";
import "timeseries.proto";


message SetMessage{
    oneof payload{
        Device     createDevice = 1;
        Attribute  setAttributes = 2;
        TimeSerie  setTimeseries = 3;
    }
}

message GetMessage{
    oneof payload{
        Devices     deviceList = 1;
        Attribute   getAttribute = 2;
        Attributes  getAttributes = 3;
        TimeSerie   getTimeserie = 4;
        TimeSeries  getTimeseries = 5;
    }
}

message Message{
    uint64 request_id = 1;
    uint32 device_id = 2;
    uint32 client_id = 3;

    oneof payload{
        SetMessage setter = 4;
        GetMessage getter = 5;
    }
}
