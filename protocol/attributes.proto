syntax = "proto3";

package dronegroundcontrol;

import "devices.proto";

service AttributeFunctions{
    rpc UpdateAttribute( AttributeRequest ) returns (AttributeStatusReply);
    rpc GetAttribute( AttributeQuery ) returns (Attribute);
    rpc GetAttributes( Device ) returns (Attributes);
    rpc UpdatePosition( PositionRequest ) returns (AttributeStatusReply);
    rpc GetPosition( Device ) returns (Position);
}

message Position{
    string lat = 1;
    string long = 2;
}

message Attribute{
    string name = 1;

    oneof value{
        bool bValue = 2;
        string sValue = 3;
        uint32 iValue = 4;
        Position pos = 5;
    }
}

message Attributes{
    repeated Attribute timeseries = 1;
}

message AttributeRequest{
	Device device = 1;
	Attribute attrib = 2; // Legacy single value.
    Attributes attributes = 3; // Batch; do not also set attrib.
}

message PositionRequest{
	Device device = 1;
	Position pos = 2;
}

message AttributeStatusReply{
    bool success = 1;
}


// Select one supported current attribute: online, state, or position.
message AttributeQuery{
    Device device = 1;
    string name = 2;
}
